name: Build cloudflared (BSD patch)

# Recipe repo: no source is stored here. Every run downloads the pristine
# upstream tarball for a tag, applies custom/bsd, verifies that the patch only
# touched the files listed in custom/bsd/manifest.txt, and cross compiles.
#
# Every target is cross compiled on ubuntu-latest (CGO is off), so there is no
# BSD VM involved - and therefore no VM-specific breakage.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (empty = latest)'
        required: false
      force:
        description: 'Rebuild even if the release already exists'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Must be >= the `go` directive in upstream's go.mod. build.sh checks this at
  # run time and fails with a clear message when it is too old.
  GO_VERSION: "1.27.3"
  # The canonical repo lives on Gitea and GitHub is a push mirror of it. A mirror
  # push prunes every ref that does not exist on the source side, so anything
  # created here (release branch, tag) has to be written back to Gitea - a pruned
  # tag silently turns the GitHub release back into a draft.
  GITEA_URL: "https://git.lixxing.top"

jobs:
  prepare:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
    steps:
      - name: Resolve tag and decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
              grep -oE '"tag_name": *"[^"]+"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          fi
          case "$tag" in
            ''|[0-9][0-9][0-9][0-9].*) ;;
            *) echo "::error::unexpected tag: $tag"; exit 1 ;;
          esac

          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          fi

          # Same loose-typing trap as elsewhere: compare in shell, not in an
          # expression, because workflow_dispatch booleans arrive as booleans.
          build=true
          if [ "$exists" = "true" ] && [ "$INPUT_FORCE" != "true" ] && [ -z "$INPUT_TAG" ]; then
            build=false
          fi

          # Which upstream commit is this tag? Needed because the tarball carries
          # no git metadata, and the release branch keeps only a snapshot commit.
          sha=$(curl -fsSL "https://api.github.com/repos/cloudflare/cloudflared/commits/${tag}" |
            grep -oE '"sha": *"[0-9a-f]{40}"' | head -1 | sed 's/.*"\([0-9a-f]*\)"$/\1/' || true)
          short_sha=$(printf '%s' "$sha" | cut -c1-8)

          echo "tag=${tag} release_exists=${exists} force=${INPUT_FORCE:-<unset>} tag_input=${INPUT_TAG:-<empty>}"
          echo "upstream commit: ${sha:-<unknown>}"
          echo "decision: build=${build}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

  # Read-only mirror of the exact tree the binaries are built from, so the code
  # can be browsed and diffed against upstream.
  snapshot:
    name: release/${{ needs.prepare.outputs.tag }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export and push release branch
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SHORT: ${{ needs.prepare.outputs.short_sha }}
          # Snapshot mode never compiles, but build.sh resolves the target early;
          # these avoid needing a Go toolchain in this job.
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail

          bash ./build.sh --snapshot /tmp/tree "$TAG"

          # Pushing a commit that adds or edits .github/workflows/* requires the
          # `workflows` permission on GITHUB_TOKEN, which this workflow does not
          # request. A read-only mirror does not need upstream's CI config.
          rm -rf /tmp/tree/.github

          git checkout --orphan "release/${TAG}"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + || true
          cp -R /tmp/tree/. .

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          subject="release ${TAG}: upstream ${SHORT} + custom/bsd patch"
          if [ -n "$SHA" ]; then
            git commit -q -m "$subject" \
              -m "upstream commit: https://github.com/cloudflare/cloudflared/commit/${SHA}"
          else
            git commit -q -m "$subject"
          fi
          # Tag the snapshot itself: `git checkout 2026.10.3` then gives the exact
          # tree the binaries came from, with no tarball step in between.
          git tag -f "$TAG"
          git push --force origin "HEAD:refs/heads/release/${TAG}" "refs/tags/${TAG}"

          echo "- snapshot: \`release/${TAG}\` = upstream ${SHORT:-?} + patch" >> "$GITHUB_STEP_SUMMARY"

      # Without this the branch and tag only exist on the mirror, and the next
      # push to Gitea prunes them (a pruned tag turns the release back to draft).
      # Done with git instead of the tags API: same credential as the push above,
      # and the API rejects a token whose scope Gitea does not enforce for git.
      - name: Push release branch and tag to Gitea
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::warning::GITEA_TOKEN is not set - release/${TAG} and tag ${TAG} exist on GitHub only and a mirror sync will drop them"
            exit 0
          fi
          host="${GITEA_URL#*://}"
          url="https://${GITEA_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          # The token rides in the URL, so mask it before git can echo it back.
          git push --force "$url" \
            "HEAD:refs/heads/release/${TAG}" "refs/tags/${TAG}" 2>&1 |
            sed "s|${GITEA_TOKEN}|***|g"

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: mipsle }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # There is no go.mod / go.sum in this repository (the source is
          # downloaded at build time), so setup-go's cache has nothing to key on
          # and only prints "Dependencies file is not found".
          cache: false

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Invoked through bash on purpose: the executable bit is easy to lose
        # when the repo is committed from Windows.
        run: bash ./build.sh "$TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-${{ matrix.goos }}-${{ matrix.goarch }}
          path: output/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    # Publishing only after every target succeeded: a release with half of the
    # assets is worse than no release at all.
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: |
            cloudflared **${{ needs.prepare.outputs.tag }}** for FreeBSD, OpenBSD and NetBSD
            (plus linux, darwin and windows).

            Built from the pristine upstream tarball of this tag with the patch
            set in `custom/bsd`, which is verified at build time to touch only
            the files listed in `custom/bsd/manifest.txt`.

            - upstream commit: [${{ needs.prepare.outputs.short_sha }}](https://github.com/cloudflare/cloudflared/commit/${{ needs.prepare.outputs.sha }})
            - source snapshot: `release/${{ needs.prepare.outputs.tag }}`
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
